- string:
    question:
      types: string
      text_data: Sample text for string
      code_path: null
      image: null
      help: null
    answer:
      is_html_enabled: true
      pattern: hello, world
      use_re: false
      match_substring: false
      case_sensitive: false
      code: '#'
      is_text_disabled: false
      is_file_disabled: true
